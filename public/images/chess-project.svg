<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0f1724" />
      <stop offset="1" stop-color="#081226" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="b" />
      <feBlend in="SourceGraphic" in2="b" mode="normal" />
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)" />

  <!-- Left hero text -->
  <g transform="translate(60,80)">
    <rect x="0" y="-10" width="520" height="60" rx="18" fill="#0b2a2a" opacity="0.15"/>
    <text x="0" y="20" font-family="Inter, Arial" font-size="18" fill="#9EEAD6">BETA ACCESS LIVE</text>
    <text x="0" y="110" font-family="Inter, Arial" font-size="72" font-weight="700" fill="#ffffff">Master the</text>
    <text x="0" y="190" font-family="Inter, Arial" font-size="72" font-weight="700" fill="#ffffff">board.</text>
    <text x="0" y="250" font-family="Inter, Arial" font-size="18" fill="#94a3b8" max-width="520">Experience chess in its purest form. A distraction-free, blisteringly fast environment designed specifically for focus and performance.</text>

    <!-- Controls box -->
    <rect x="0" y="300" width="420" height="220" rx="18" fill="#0f1724" opacity="0.35" stroke="#1f2937"/>
    <g transform="translate(20,320)" fill="#cbd5e1" font-family="Inter, Arial">
      <text x="0" y="28" font-size="18">Play Online</text>
      <text x="0" y="78" font-size="18">🔋 10 min Rapid</text>
      <text x="0" y="118" font-size="18">⚡ 3 min Blitz</text>
      <text x="0" y="158" font-size="18">🚀 1 min Bullet</text>
    </g>
  </g>

  <!-- Right panel (chess board and UI) -->
  <g transform="translate(780,60)">
    <rect x="0" y="0" width="560" height="640" rx="24" fill="#0b1720" stroke="#18303b" stroke-width="2"/>
    <g transform="translate(28,28)">
      <!-- Board background -->
      <rect width="504" height="504" rx="12" fill="#dfeee0"/>
      <!-- 8x8 squares -->
      <g>
        <!-- draw squares programmatically -->
        <!-- light squares -->
        <g fill="#f3f7ef">
          <!-- none: base rectangle already light -->
        </g>
        <g fill="#8ab57a">
          <!-- manually place darker squares -->
          <!-- row 1 (y=0) -->
          <rect x="63" y="0" width="63" height="63"/>
          <rect x="189" y="0" width="63" height="63"/>
          <rect x="315" y="0" width="63" height="63"/>
          <rect x="441" y="0" width="63" height="63"/>
          <!-- row 2 (y=63) -->
          <rect x="0" y="63" width="63" height="63"/>
          <rect x="126" y="63" width="63" height="63"/>
          <rect x="252" y="63" width="63" height="63"/>
          <rect x="378" y="63" width="63" height="63"/>
          <!-- row 3 -->
          <rect x="63" y="126" width="63" height="63"/>
          <rect x="189" y="126" width="63" height="63"/>
          <rect x="315" y="126" width="63" height="63"/>
          <rect x="441" y="126" width="63" height="63"/>
          <!-- row 4 -->
          <rect x="0" y="189" width="63" height="63"/>
          <rect x="126" y="189" width="63" height="63"/>
          <rect x="252" y="189" width="63" height="63"/>
          <rect x="378" y="189" width="63" height="63"/>
          <!-- row 5 -->
          <rect x="63" y="252" width="63" height="63"/>
          <rect x="189" y="252" width="63" height="63"/>
          <rect x="315" y="252" width="63" height="63"/>
          <rect x="441" y="252" width="63" height="63"/>
          <!-- row 6 -->
          <rect x="0" y="315" width="63" height="63"/>
          <rect x="126" y="315" width="63" height="63"/>
          <rect x="252" y="315" width="63" height="63"/>
          <rect x="378" y="315" width="63" height="63"/>
          <!-- row 7 -->
          <rect x="63" y="378" width="63" height="63"/>
          <rect x="189" y="378" width="63" height="63"/>
          <rect x="315" y="378" width="63" height="63"/>
          <rect x="441" y="378" width="63" height="63"/>
          <!-- row 8 -->
          <rect x="0" y="441" width="63" height="63"/>
          <rect x="126" y="441" width="63" height="63"/>
          <rect x="252" y="441" width="63" height="63"/>
          <rect x="378" y="441" width="63" height="63"/>
        </g>

        <!-- simple piece markers -->
        <g fill="#0b1720" font-size="32" font-family="Arial" text-anchor="middle">
          <text x="31.5" y="472">♟</text>
          <text x="94.5" y="472">♟</text>
          <text x="157.5" y="472">♟</text>
          <text x="220.5" y="472">♟</text>
          <text x="283.5" y="472">♟</text>
          <text x="346.5" y="472">♟</text>
          <text x="409.5" y="472">♟</text>
          <text x="472.5" y="472">♟</text>
        </g>
      </g>

      <!-- Play button -->
      <rect x="380" y="540" width="120" height="40" rx="10" fill="#1f2937" />
      <text x="440" y="568" text-anchor="middle" fill="#fff" font-family="Inter, Arial" font-size="14">Play</text>
    </g>
  </g>

  <!-- top-left brand -->
  <g transform="translate(40,20)">
    <circle cx="22" cy="22" r="18" fill="#06b6d4" />
    <text x="56" y="28" font-family="Inter, Arial" font-size="22" fill="#fff" font-weight="700">Project Chess</text>
  </g>
</svg>