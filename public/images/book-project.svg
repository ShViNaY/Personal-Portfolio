<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640">
  <!-- Background and header to match the screenshot look -->
  <rect width="1200" height="640" fill="#000" />
  <rect x="0" y="0" width="1200" height="48" fill="#07A35A" />

  <!-- Thin top border line on header (right side scrollbar mimic) -->
  <rect x="1200" y="0" width="2" height="640" fill="#444" />

  <!-- Title -->
  <text x="120" y="120" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="56" fill="#fff">Top 50 Books</text>

  <!-- Four thumbnail columns (row 1) -->
  <g transform="translate(120,170)" fill="#111">
    <!-- Book 1 -->
    <g transform="translate(0,0)">
      <rect width="92" height="140" rx="4" fill="#b54" />
      <text x="0" y="160" font-size="12" fill="#fff">Harry Potter and the Prisoner of Azkaban</text>
      <text x="0" y="180" font-size="12" fill="#fff">J. K. Rowling</text>
    </g>

    <!-- Book 2 -->
    <g transform="translate(200,0)">
      <rect width="92" height="140" rx="4" fill="#b87" />
      <text x="0" y="160" font-size="12" fill="#fff">Harry Potter and the Goblet of Fire</text>
      <text x="0" y="180" font-size="12" fill="#fff">J. K. Rowling</text>
    </g>

    <!-- Book 3 -->
    <g transform="translate(400,0)">
      <rect width="92" height="140" rx="4" fill="#c86" />
      <text x="0" y="160" font-size="12" fill="#fff">Harry Potter and the Sorcerer's Stone</text>
      <text x="0" y="180" font-size="12" fill="#fff">J. K. Rowling</text>
    </g>

    <!-- Book 4 -->
    <g transform="translate(600,0)">
      <rect width="92" height="140" rx="4" fill="#36a" />
      <text x="0" y="160" font-size="12" fill="#fff">Harry Potter and the Order of the Phoenix</text>
      <text x="0" y="180" font-size="12" fill="#fff">J. K. Rowling</text>
    </g>
  </g>

  <!-- Second row of thumbnails -->
  <g transform="translate(120,360)" fill="#111">
    <g transform="translate(0,0)">
      <rect width="92" height="140" rx="4" fill="#a33" />
      <text x="0" y="160" font-size="12" fill="#fff">Harry Potter and the Chamber of Secrets</text>
      <text x="0" y="180" font-size="12" fill="#fff">J. K. Rowling</text>
    </g>
    <g transform="translate(200,0)">
      <rect width="92" height="140" rx="4" fill="#d9b" />
      <text x="0" y="160" font-size="12" fill="#fff">The Hobbit</text>
      <text x="0" y="180" font-size="12" fill="#fff">J. R. R. Tolkien</text>
    </g>
    <g transform="translate(400,0)">
      <rect width="92" height="140" rx="4" fill="#b26" />
      <text x="0" y="160" font-size="12" fill="#fff">The Fellowship of the Ring</text>
      <text x="0" y="180" font-size="12" fill="#fff">J. R. R. Tolkien</text>
    </g>
    <g transform="translate(600,0)">
      <rect width="92" height="140" rx="4" fill="#d97" />
      <text x="0" y="160" font-size="12" fill="#fff">Harry Potter (Paperback)</text>
      <text x="0" y="180" font-size="12" fill="#fff">J. K. Rowling</text>
    </g>
  </g>

  <!-- Footer info box hint -->
  <rect x="100" y="520" width="1000" height="88" rx="12" fill="#0b0b0b" opacity="0.6" />
  <text x="140" y="560" fill="#bbb" font-size="14">More projects can be added here later. Each project supports a screenshot, technology tags, GitHub link and optional live-demo link.</text>
</svg>